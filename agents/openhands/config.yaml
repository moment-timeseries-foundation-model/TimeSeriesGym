openhands:
  start: openhands/start.sh
  dockerfile: openhands/Dockerfile
  kwargs_type: argparse
  kwargs:
    agent: CodeActAgent
    model: gpt-4.1-2025-04-14  # gpt-4o-2024-08-06
    max_time_in_hours: 6
    max_steps: 500
    shm_size: "100G"
    enable_debugging: false
    enable_default_condenser: true
    input_cost_per_token: .000002  # .0000025 for gpt-4o
    output_cost_per_token: .000008  # .00001 for gpt-4o
    caching_prompt: true
    enable_browsing: false
  model_proxy: # the API key stays on the host, in the run's model proxy (agents/model_proxy.py)
    providers:
      openai:
        key: ${{ secrets.OPENAI_API_KEY }}
        models: [gpt-4.1-2025-04-14]
    max_requests: 2000 # steps and the condenser's summaries
    max_seconds: 23400 # max_time_in_hours and 30 minutes
  privileged: true
