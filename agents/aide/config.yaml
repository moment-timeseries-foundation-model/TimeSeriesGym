vars:
  step_count: &step_count 50
  time_limit: &time_limit 14400
  # API keys stay on the host, in the run's model proxy (agents/model_proxy.py)
  openai_key: &openai_key ${{ secrets.OPENAI_API_KEY }}
  anthropic_key: &anthropic_key ${{ secrets.ANTHROPIC_API_KEY }}
  openrouter_key: &openrouter_key ${{ secrets.OPENROUTER_API_KEY }}
  gemini_key: &gemini_key ${{ secrets.GEMINI_API_KEY }}
  proxy_limits: &proxy_limits
    max_requests: 1000 # about 2 model calls per step, with retries
    max_seconds: 16200 # the time limit and 30 minutes

defaults: &defaults
  start: aide/start.sh
  dockerfile: aide/Dockerfile
  kwargs_type: omegaconf
  env_vars: &env_vars
    TIME_LIMIT_SECS: *time_limit
    STEP_LIMIT: *step_count

kwargs_common: &kwargs_common
  agent.search.max_debug_depth: 20 # debug down a branch for up to 20 steps
  agent.search.debug_prob: 1 # always debug when there's something to debug
  agent.time_limit: *time_limit
  exec.timeout: 32400 # 9 hours limit _per step_, to match max of kaggle.com
  copy_data: False # use symbolic links
  agent.cost_limit: null # int for USD amount (or null if you want to disable this)
  agent.remind_resource_limit: True # remind the user of the resource limit

aide:
  <<: *defaults
  kwargs:
    <<: *kwargs_common
    agent.code.model: gpt-4.1-2025-04-14
    agent.feedback.model: gpt-4.1-2025-04-14
    agent.steps: *step_count
  model_proxy:
    <<: *proxy_limits
    providers:
      openai: {key: *openai_key, models: [gpt-4.1-2025-04-14]}

aide/dev:
  <<: *defaults
  kwargs:
    <<: *kwargs_common
    agent.code.model: gpt-4o-2024-08-06
    agent.feedback.model: gpt-4o-2024-08-06
    agent.steps: 8
  model_proxy:
    <<: *proxy_limits
    providers:
      openai: {key: *openai_key, models: [gpt-4o-2024-08-06]}

aide/o1-preview:
  <<: *defaults
  kwargs:
    <<: *kwargs_common
    agent.code.model: o1-preview
    agent.code.temp: 1
    agent.feedback.model: gpt-4o-2024-08-06
    agent.steps: *step_count
    agent.convert_system_to_user: True
  model_proxy:
    <<: *proxy_limits
    providers:
      openai: {key: *openai_key, models: [o1-preview, gpt-4o-2024-08-06]}

aide/gpt-4-turbo:
  <<: *defaults
  kwargs:
    <<: *kwargs_common
    agent.code.model: gpt-4-turbo-2024-04-09
    agent.feedback.model: gpt-4-turbo-2024-04-09
    agent.steps: *step_count
  model_proxy:
    <<: *proxy_limits
    providers:
      openai: {key: *openai_key, models: [gpt-4-turbo-2024-04-09]}

aide/gpt-4-turbo-dev:
  <<: *defaults
  kwargs:
    <<: *kwargs_common
    agent.code.model: gpt-4-turbo-2024-04-09
    agent.feedback.model: gpt-4-turbo-2024-04-09
    agent.steps: 8
  model_proxy:
    <<: *proxy_limits
    providers:
      openai: {key: *openai_key, models: [gpt-4-turbo-2024-04-09]}

aide/gpt-3.5-turbo-0125:
  <<: *defaults
  kwargs:
    <<: *kwargs_common
    agent.code.model: gpt-3.5-turbo-0125
    agent.feedback.model: gpt-3.5-turbo-0125
    agent.steps: *step_count
  model_proxy:
    <<: *proxy_limits
    providers:
      openai: {key: *openai_key, models: [gpt-3.5-turbo-0125]}

aide/gpt-3.5-dev:
  <<: *defaults
  kwargs:
    <<: *kwargs_common
    agent.code.model: gpt-3.5-turbo-0125
    agent.feedback.model: gpt-3.5-turbo-0125
    agent.steps: 8
  model_proxy:
    <<: *proxy_limits
    providers:
      openai: {key: *openai_key, models: [gpt-3.5-turbo-0125]}

aide/claude-3-5-sonnet:
  <<: *defaults
  kwargs:
    <<: *kwargs_common
    agent.code.model: claude-3-5-sonnet-20240620
    agent.feedback.model: gpt-4o-2024-08-06
    agent.steps: *step_count
  model_proxy:
    <<: *proxy_limits
    providers:
      anthropic: {key: *anthropic_key, models: [claude-3-5-sonnet-20240620]}
      openai: {key: *openai_key, models: [gpt-4o-2024-08-06]} # the feedback model

aide/llama-3.1-405b-instruct:
  <<: *defaults
  kwargs:
    <<: *kwargs_common
    agent.code.model: meta-llama/llama-3.1-405b-instruct
    agent.feedback.model: gpt-4o-2024-08-06
    agent.steps: *step_count
  # aide's OpenRouter client has its URL built in; it must read OPENROUTER_BASE_URL to reach
  # the model proxy (see agents/README.md)
  model_proxy:
    <<: *proxy_limits
    providers:
      openrouter: {key: *openrouter_key, models: [meta-llama/llama-3.1-405b-instruct]}
      openai: {key: *openai_key, models: [gpt-4o-2024-08-06]} # the feedback model

aide/gemini-1.5-pro:
  <<: *defaults
  kwargs:
    <<: *kwargs_common
    agent.code.model: gemini-1.5-pro-002
    agent.feedback.model: gpt-4o-2024-08-06
    agent.steps: *step_count
  # aide's Gemini client (Google's SDK) cannot be pointed at the model proxy; it must use
  # Gemini's OpenAI-compatible API at GEMINI_BASE_URL (see agents/README.md)
  model_proxy:
    <<: *proxy_limits
    providers:
      gemini: {key: *gemini_key, models: [gemini-1.5-pro-002]}
      openai: {key: *openai_key, models: [gpt-4o-2024-08-06]} # the feedback model

aide/obfuscated:
  <<: *defaults
  kwargs:
    <<: *kwargs_common
    agent.code.model: gpt-4o-2024-08-06
    agent.feedback.model: gpt-4o-2024-08-06
    agent.steps: *step_count
    agent.obfuscate: True
  env_vars:
    <<: *env_vars
    OBFUSCATE: "true"
  model_proxy:
    <<: *proxy_limits
    providers:
      openai: {key: *openai_key, models: [gpt-4o-2024-08-06]}
