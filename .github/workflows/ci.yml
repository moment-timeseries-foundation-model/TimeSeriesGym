# Lint and tests for pushes to main and for pull requests (a pull request from a branch of this
# repository runs once, not also for the push). Uses no secrets; the tests need no network
# access beyond installing the dependencies, and no Kaggle credentials. README.md, "Running the
# CI Checks Locally", gives the same commands.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      # the dev extra allows ruff>=0.3.0; the code is formatted with 0.6.9
      - run: pip install ruff==0.6.9
      - run: ruff check --output-format=github
      - run: ruff format --check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # pytest loads deepeval's plugin, and deepeval sends telemetry on import unless opted out
      DEEPEVAL_TELEMETRY_OPT_OUT: "YES"
    steps:
      # without Git LFS: the unit tests do not read timeseriesgym/data/
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      # CPU-only PyTorch (the torch pin in pyproject.toml), so pip skips the CUDA wheels
      - run: pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e .
      # the tests marked `network` download real competition data
      - run: python -m pytest -m "not network"
